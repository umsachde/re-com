name: tests

# The unit suite needs no network, no credentials and no *-mcp server, which is
# what makes it CI-able at all -- `tests/conftest.py` redirects every store to a
# temp path and fails any test that opens a real socket. The live half
# (`scripts/smoke_all.py`) needs a real account and is run by hand; see the
# "Verification" section of PLAN.md for what each half is responsible for.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares (requires-python >= 3.10), not
        # whatever the developer happens to run. sqlite3.threadsafety and the
        # graph cache's per-thread connections are version-sensitive enough
        # that testing one interpreter would not prove much.
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Coverage
        run: pytest --cov=server --cov-report=term-missing -q

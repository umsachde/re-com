[project]
name = "re-com"
version = "0.2.0"
description = "MCP server that recommends new songs by mood, guaranteed to exclude anything already in your library (backend: YouTube Music)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
]

[project.optional-dependencies]
# Includes ytmusicapi: the unit suite (test_v2.py, test_v6.py, test_filters.py)
# imports it directly for exception types, even though the live path never
# does -- see the `youtube` extra below.
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ytmusicapi>=1.12.2"]
# Optional: mood labelling by reading lyrics with Claude. Everything else works
# without it, on mood-playlist membership and artist propagation alone.
llm = ["anthropic>=0.40"]
# Optional: the offline YouTube indexing/labelling scripts (build_atlas.py,
# build_genres.py, maintain.py, label_library.py, snapshot_history.py,
# setup_auth.py, setup_auth_from_file.py) and lyrics.py import ytmusicapi
# directly. The live path (server.py, signals.py, provider.py) never does --
# YouTube is only ever reached through the sibling ytmusic-mcp subprocess. A
# Spotify-only install has no reason to pull in a YouTube Music client it will
# never call.
youtube = ["ytmusicapi>=1.12.2"]
# Optional: the v0 orchestration experiment (scripts/orchestrate.py, PLAN.md
# 7.7). Nothing in the engine or the live path imports it.
agent = ["claude-agent-sdk>=0.2"]

[project.urls]
Homepage = "https://github.com/umsachde/re-com"

[tool.setuptools]
# Listed explicitly because this project is a flat layout: 21 modules sitting
# at the repo root next to scripts/ and tests/. Setuptools' auto-discovery
# refuses that outright ("Multiple top-level modules discovered in a
# flat-layout") rather than guessing which of them are the package, so without
# this `pip install -e .` -- the README's own setup step -- fails on any
# machine whose setuptools is recent enough to enforce it. Existing installs
# were unaffected and hid it; CI found it on its first run.
#
# Keep in sync when adding a root module. A new module that isn't listed stays
# importable from the repo (tests put the root on sys.path) but is missing from
# an installed copy, which is the quiet half of this failure.
py-modules = [
    "arc",
    "atlas",
    "brainz",
    "filters",
    "graph",
    "graph_atlas",
    "graph_store",
    "judge",
    "label",
    "lastfm",
    "lyrics",
    "match",
    "moodspace",
    "provider",
    "recommend",
    "sense",
    "server",
    "signals",
    "spotify_client",
    "store",
    "taxonomy",
    "tempo",
    "ytmusic_client",
]
# tools/ is a real package (PLAN.md 7.9: server.py's tool bodies extracted out
# of the 1,193-line flat file it used to be), not another flat module -- listed
# separately since py-modules and packages are different setuptools concepts.
packages = ["tools"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
